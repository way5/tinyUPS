<!DOCTYPE html>
<html lang="en-US" class="dark">

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="origin" />
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="setup.pageTitle"></title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
    <!-- FORM START -->
    <section class="setup-wrapper">
        <div class="setup-container">
            <button type="button" class="group reset-solo" data-tooltip="setup.restartButtonTooltip"
                data-tooltip-placement="right">
                <!-- <i class="ti ti-rotate-rectangle"></i> -->
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="icon w-5 h-5 dark:group-hover:stroke-white group-hover:stroke-white" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="icon icon-tabler icons-tabler-outline icon-tabler-rotate-rectangle">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M10.09 4.01l.496 -.495a2 2 0 0 1 2.828 0l7.071 7.07a2 2 0 0 1 0 2.83l-7.07 7.07a2 2 0 0 1 -2.83 0l-7.07 -7.07a2 2 0 0 1 0 -2.83l3.535 -3.535h-3.988" />
                    <path d="M7.05 11.038v-3.988" />
                </svg>
            </button>
            <button type="button" class="group dmode-solo" id="dmode">
                <!-- <i class="ti ti-sun"></i> -->
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="icon w-5 h-5 dark:group-hover:stroke-white group-hover:stroke-white" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                    <path
                        d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
                </svg>
            </button>
            <div class="flex flex-col mx-auto text-center my-6">
                <h1 class="text-3xl font-bold mb-4">tinyUPS</h1>
                <p class="text-sm font-narrow" data-i18n="[html]setup.intro"></p>
            </div>
            <form name="setup" class="form-wrapper smdn:mx-2 mx-4" method="POST" action="/" autocomplete="off">
                <div class="header">
                    <!-- <i class="ti ti-brand-auth0"></i> -->
                    <h4 data-i18n="[append]setup.hdrAdminAccess">
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon w-6 h-6" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M12 14.5l-5.5 3.5l2 -6l-4.5 -4h6l2 -5l2 5h6l-4.5 4l2 6z" />
                            <path
                                d="M20.507 8.872l-2.01 -5.872h-12.994l-2.009 5.872c-1.242 3.593 -.135 7.094 3.249 9.407l5.257 3.721l5.257 -3.721c3.385 -2.313 4.49 -5.814 3.25 -9.407z" />
                        </svg>
                    </h4>
                    <button data-tooltip="setup.helpAdminTooltip" data-tooltip-placement="left" type="button"
                        class="tooltip-button">
                        <!-- <i class="ti ti-info-circle"></i> -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon w-6 h-6" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-info-circle">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
                            <path d="M12 9h.01" />
                            <path d="M11 12h1v4h1" />
                        </svg>
                    </button>
                </div>
                <div class="flex-form-block-full">
                    <div>
                        <div class="relative">
                            <label data-i18n="inpUsername"></label>
                            <input type="text" name="login" minlength="2" maxlength="12" required />
                        </div>
                    </div>
                    <div>
                        <div class="relative">
                            <label data-i18n="inpPassword"></label>
                            <div class="relative inline-flex place-content-center w-full">
                                <input type="password" name="pass" minlength="6" maxlength="12" required />
                                <button type="button" class="showkey group">
                                    <!-- <i class="ti ti-eye group-[.active]:hidden"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon w-4 h-4 group-[.active]:block hidden" viewBox="0 0 24 24"
                                        fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round"
                                        stroke-linejoin="round">
                                        <path
                                            d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
                                        </path>
                                        <circle cx="12" cy="12" r="3"></circle>
                                    </svg>
                                    <!-- <i class="ti ti-eye-x hidden group-[.active]:block"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg" class="icon w-4 h-4 group-[.active]:hidden"
                                        viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path
                                            d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49">
                                        </path>
                                        <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                                        <path
                                            d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143">
                                        </path>
                                        <path d="m2 2 20 20"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="header">
                    <!-- <i class="ti ti-access-point"></i> -->
                    <h4 data-i18n="[append]setup.hdrWiFiAccessPoint">
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="icon w-6 h-6 dark:group-hover:stroke-white group-hover:stroke-white"
                            viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M18.364 19.364a9 9 0 1 0 -12.728 0" />
                            <path d="M15.536 16.536a5 5 0 1 0 -7.072 0" />
                            <path d="M12 13m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                        </svg>
                    </h4>
                    <button data-tooltip="setup.helpWiFiTooltip" data-tooltip-placement="left" type="button"
                        class="tooltip-button">
                        <!-- <i class="ti ti-info-circle"></i> -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="icon w-6 h-6" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                            class="icon icon-tabler icons-tabler-outline icon-tabler-info-circle">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0" />
                            <path d="M12 9h.01" />
                            <path d="M11 12h1v4h1" />
                        </svg>
                    </button>
                </div>
                <div class="flex-form-block-full">
                    <div class="relative">
                        <label data-i18n="inpSSID"></label>
                        <div class="flex mx-auto overflow-hidden">
                            <select name="ssid"></select>
                            <button type="button" id="dosurvey" data-tooltip="buttonDoSurvey" data-tooltip-placement="top"
                                class="form-rounded-button ml-2 group">
                                <!-- <i class="ti ti-broadcast"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="icon w-5 h-5 dark:group-hover:stroke-white group-hover:stroke-white"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M18.364 19.364a9 9 0 1 0 -12.728 0" />
                                    <path d="M15.536 16.536a5 5 0 1 0 -7.072 0" />
                                    <path d="M12 13m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0" />
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="relative">
                        <label data-i18n="inpSSIDKey"></label>
                        <div class="relative inline-flex place-content-center w-full">
                            <input type="password" name="ssidkey" maxlength="30" required />
                            <button type="button" class="showkey group">
                                <!-- <i class="ti ti-eye group-[.active]:hidden"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="icon w-4 h-4 group-[.active]:block hidden" viewBox="0 0 24 24" fill="none"
                                    stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0">
                                    </path>
                                    <circle cx="12" cy="12" r="3"></circle>
                                </svg>
                                <!-- <i class="ti ti-eye-x hidden group-[.active]:block"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="icon w-4 h-4 group-[.active]:hidden"
                                    viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path
                                        d="M10.733 5.076a10.744 10.744 0 0 1 11.205 6.575 1 1 0 0 1 0 .696 10.747 10.747 0 0 1-1.444 2.49">
                                    </path>
                                    <path d="M14.084 14.158a3 3 0 0 1-4.242-4.242"></path>
                                    <path
                                        d="M17.479 17.499a10.75 10.75 0 0 1-15.417-5.151 1 1 0 0 1 0-.696 10.75 10.75 0 0 1 4.446-5.143">
                                    </path>
                                    <path d="m2 2 20 20"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col mt-8 w-full">
                    <input type="submit" data-i18n="[value]inpSubmitSetup" />
                </div>
                <div class="footer">
                    <span class="pl-2 cursor-help">
                        <span class="ap-mac-address" data-tooltip="setup.helpApMAC" data-tooltip-placement="top"></span>
                    </span>
                    <span class="pr-2">
                        <a href="https://github.com/way5/tinyUPS" data-i18n="[title]gotoGithubLink" class="github" target="_blank">
                            <!-- <i class="ti ti-brand-github pr-1"></i> -->
                            <svg xmlns="http://www.w3.org/2000/svg" class="icon" viewBox="0 0 24 24" fill="none"
                                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path
                                    d="M9 19c-4.3 1.4 -4.3 -2.5 -6 -3m12 5v-3.5c0 -1 .1 -1.4 -.5 -2c2.8 -.3 5.5 -1.4 5.5 -6a4.6 4.6 0 0 0 -1.3 -3.2a4.2 4.2 0 0 0 -.1 -3.2s-1.1 -.3 -3.5 1.3a12.3 12.3 0 0 0 -6.2 0c-2.4 -1.6 -3.5 -1.3 -3.5 -1.3a4.2 4.2 0 0 0 -.1 3.2a4.6 4.6 0 0 0 -1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6 .6 -.6 1.2 -.5 2v3.5" />
                            </svg>
                            tinyUPS&nbsp;/&nbsp;2022&ndash;
                        </a>
                    </span>
                </div>
            </form>
        </div>
    </section>
    <!-- FORM END -->
    <!-- MODAL START -->
    <div id="modal" tabindex="-1" class="modal">
        <div class="modal-backdrop-overlay"></div>
        <div class="modal-main text-center max-w-xl py-16 px-2 xl:py-24 xl:px-36 text-gray-800 dark:text-gray-50">
            <div>
                <!-- <i class="ti ti-rotate-rectangle text-[120px]"></i> -->
                <svg xmlns="http://www.w3.org/2000/svg" class="icon w-32 h-32 mx-auto" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <path
                        d="M10.09 4.01l.496 -.495a2 2 0 0 1 2.828 0l7.071 7.07a2 2 0 0 1 0 2.83l-7.07 7.07a2 2 0 0 1 -2.83 0l-7.07 -7.07a2 2 0 0 1 0 -2.83l3.535 -3.535h-3.988" />
                    <path d="M7.05 11.038v-3.988" />
                </svg>
                <h2 class="text-xl font-semibold pt-6" data-i18n="[append]setup.tinyUPSisRestarting">tinyUPS</h2>
            </div>
            <div class="mt-8">
                <div class="mx-10 smdn:mx-5">
                    <p data-i18n="[html]setup.finalInfo"></p>
                </div>
                <p class="mt-14 sm:w-90 text-sm" data-i18n="[html]setup.closeWindow"></p>
            </div>
        </div>
    </div>
    <!-- MODAL END -->
</body>

</html>
