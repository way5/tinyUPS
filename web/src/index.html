<!DOCTYPE html>
<html lang="en-US" class="dark">

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="origin" />
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="index.pageTitle"></title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
    <!-- LOADER BEGIN -->
    <div id="loader" tabindex="-1"
        class="inset-0 fixed w-full h-full items-center justify-center duration-300 transition-opacity ease-in-out z-50 bg-gray-200 dark:bg-base-700"
        role="banner">
        <div class="flex flex-col w-full h-full justify-center items-center text-gray-800 dark:text-gray-100">
            <!-- <i class="ti ti-loader-2 animate-spin animate-duration-700 text-xl"></i> -->
            <svg xmlns="http://www.w3.org/2000/svg"
                class="icon w-8 h-8 animate-spin animate-duration-700 stroke-gray-800 dark:stroke-gray-100"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                <path d="M12 3a9 9 0 1 0 9 9" />
            </svg>
            <div class="mt-3 font-mono text-base" data-i18n="titleLoading"></div>
        </div>
    </div>
    <!-- LOADER END -->
    <!-- CONTENT BEGIN -->
    <div class="relative flex flex-col flex-1 overflow-y-auto overflow-x-hidden">
        <!-- NAVIGATION BEGINN -->
        <header>
            <div class="nav-bar">
                <a href="/" data-i18n="[title]index.dashboard">
                    <div class="nav-bar-logo">
                        <h1>tinyUPS</h1>
                        <p data-i18n="slogan"></p>
                    </div>
                </a>
                <div class="relative mr-2">
                    <button type="menu" class="sidebar-toggle-btn peer" data-dropdown data-dropdown-placement="bottom"
                        data-dropdown-offset="0,10" type="button">
                        <span class="sr-only" data-i18n="index.openSidebar"></span>
                        <!-- <i class="ti ti-menu-2 text-xl"></i> -->
                        <svg xmlns="http://www.w3.org/2000/svg"
                            class="icon w-7 h-7 dark:hover:stroke-base-300 hover:stroke-violet-800" viewBox="0 0 24 24"
                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M4 6l16 0" />
                            <path d="M4 12l16 0" />
                            <path d="M4 18l16 0" />
                        </svg>
                    </button>
                    <ul class="sidebar hidden mddn:dropdown-menu peer-[.show]:block">
                        <li class="item">
                            <a href="#home" data-i18n="[title]index.dashboard" class="group active">
                                <!-- <i class="ti ti-dashboard"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="icon w-7 h-7 dark:group-hover:stroke-white group-hover:stroke-violet-600 dark:group-[.active]:stroke-white group-[.active]:stroke-violet-500"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M12 13m-2 0a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
                                    <path d="M13.45 11.55l2.05 -2.05" />
                                    <path d="M6.4 20a9 9 0 1 1 11.2 0z" />
                                </svg>
                                <span class="mdup:hidden" data-i18n="index.dashboard"></span>
                            </a>
                        </li>
                        <li class="item">
                            <a href="#conf" data-i18n="[title]index.configuration" class="group">
                                <!-- <i class="ti ti-settings"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="icon w-7 h-7 dark:group-hover:stroke-white group-hover:stroke-violet-600 dark:group-[.active]:stroke-white group-[.active]:stroke-violet-500"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path
                                        d="M10.325 4.317c.426 -1.756 2.924 -1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543 -.94 3.31 .826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756 .426 1.756 2.924 0 3.35a1.724 1.724 0 0 0 -1.066 2.573c.94 1.543 -.826 3.31 -2.37 2.37a1.724 1.724 0 0 0 -2.572 1.065c-.426 1.756 -2.924 1.756 -3.35 0a1.724 1.724 0 0 0 -2.573 -1.066c-1.543 .94 -3.31 -.826 -2.37 -2.37a1.724 1.724 0 0 0 -1.065 -2.572c-1.756 -.426 -1.756 -2.924 0 -3.35a1.724 1.724 0 0 0 1.066 -2.573c-.94 -1.543 .826 -3.31 2.37 -2.37c1 .608 2.296 .07 2.572 -1.065z" />
                                    <path d="M9 12a3 3 0 1 0 6 0a3 3 0 0 0 -6 0" />
                                </svg>
                                <span class="mdup:hidden" data-i18n="index.configuration"></span>
                            </a>
                        </li>
                        <li>
                            <a href="" id="dmode" class="group">
                                <!-- <i class="ti ti-sun"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="icon w-7 h-7 dark:group-hover:stroke-white group-hover:stroke-violet-600 dark:group-[.active]:stroke-white group-[.active]:stroke-violet-500"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
                                    <path
                                        d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
                                </svg>
                                <span class="mdup:hidden" data-i18n="index.darkMode"></span>
                            </a>
                        </li>
                        <li class="separator"></li>
                        <li>
                            <a href="/logout" data-i18n="[title]index.logout" class="group">
                                <!-- <i class="ti ti-logout"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg"
                                    class="icon w-7 h-7 dark:group-hover:stroke-white group-hover:stroke-violet-600 dark:group-[.active]:stroke-white group-[.active]:stroke-violet-500"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                    stroke-linecap="round" stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path
                                        d="M14 8v-2a2 2 0 0 0 -2 -2h-7a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h7a2 2 0 0 0 2 -2v-2" />
                                    <path d="M9 12h12l-3 -3" />
                                    <path d="M18 15l3 -3" />
                                </svg>
                                <span class="mdup:hidden" data-i18n="index.logout"></span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>
        <!-- NAVIGATION END -->
        <!-- DASHBOARD BEGIN -->
        <main>
            <div id="home" class="pagecontainer grid">
                <div class="indicators-wrapper group/indicators">
                    <div class="grid grid-cols-12 gap-x-2 smdn:mt-3">
                        <div class="sttop syscard">
                            <div class="param" data-i18n="[prepend]index.deviceTemperature">
                                :<span class="systmp"></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.deviceLoad">
                                :<span class="outload"></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.freeRam">
                                :<span><span class="ram"></span> kb</span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.uptime">:<span class="uptm"></span></div>
                            <div class="param" data-i18n="[prepend]index.batteryStatus">
                                :<span>
                                    <!-- <i class="ti ti-point-filled pr-1 animate-pulse animate-duration-700 group-[.battery-low-alert]/indicators:text-[#ffda90] group-[.battery-faulty-alert]/indicators:text-[#ff9898] group-[.battery-unknown]/indicators:text-[#7a7a7a] group-[.battery-normal]/indicators:text-[#8df478]"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon w-4 h-4 pr-1 animate-pulse animate-duration-700 group-[.battery-low-alert]/indicators:text-[#ffda90] group-[.battery-faulty-alert]/indicators:text-[#ff9898] group-[.battery-unknown]/indicators:text-[#7a7a7a] group-[.battery-normal]/indicators:text-[#8df478]"
                                        viewBox="0 0 24 24" fill="currentColor">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path
                                            d="M12 7a5 5 0 1 1 -4.995 5.217l-.005 -.217l.005 -.217a5 5 0 0 1 4.995 -4.783z" />
                                    </svg>
                                    <span class="battst"></span></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.powerStatus">
                                :<span class="outst"></span>
                            </div>
                        </div>
                        <div class="sttop battcard">
                            <div class="param" data-i18n="[prepend]index.batteryTemperature">
                                :<span>
                                    <svg id="fan748" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"
                                        height="16" width="16">
                                        <path
                                            d="M258.6 0c-1.7 0-3.4 .1-5.1 .5C168 17 115.6 102.3 130.5 189.3c2.9 17 8.4 32.9 15.9 47.4L32 224H29.4C13.2 224 0 237.2 0 253.4c0 1.7 .1 3.4 .5 5.1C17 344 102.3 396.4 189.3 381.5c17-2.9 32.9-8.4 47.4-15.9L224 480v2.6c0 16.2 13.2 29.4 29.4 29.4c1.7 0 3.4-.1 5.1-.5C344 495 396.4 409.7 381.5 322.7c-2.9-17-8.4-32.9-15.9-47.4L480 288h2.6c16.2 0 29.4-13.2 29.4-29.4c0-1.7-.1-3.4-.5-5.1C495 168 409.7 115.6 322.7 130.5c-17 2.9-32.9 8.4-47.4 15.9L288 32V29.4C288 13.2 274.8 0 258.6 0zM256 224a32 32 0 1 1 0 64 32 32 0 1 1 0-64z" />
                                    </svg>
                                    <span class="battmp"> </span></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.batteryCharge">
                                :<span class="battcap"></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.inputVoltage">
                                :<span class="involt"></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.outputVoltage">
                                :<span class="outvolt"></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.diagnosticStatus">
                                :<span class="battdiast"></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.batteryLifetime">
                                :<span class="ltime"></span>
                            </div>
                        </div>
                        <div class="sttop netwcard">
                            <div class="param" data-i18n="[prepend]index.accessPoint">
                                :<span class="ap"></span>
                            </div>
                            <div class="param" data-i18n="[prepend]index.deviceIP">:<span class="ip"></span></div>
                            <div class="param" data-i18n="[prepend]index.gateway">:<span class="gw"></span></div>
                            <div class="param" data-i18n="[prepend]index.deviceMAC">:<span class="mac"></span></div>
                            <div class="param" data-i18n="[prepend]index.subnetMask">:<span class="sm"></span></div>
                            <div class="param" data-i18n="[prepend]index.date">:<span class="ctime"></span></div>
                        </div>
                    </div>
                    <!-- SERVICE MENU BEGIN -->
                    <div class="servicemenu-wrapper">
                        <div class="servicemenu-group inline-flex rounded-md shadow-sm">
                            <button class="border-r dark:border-base-400 flex items-center" type="button"
                                data-modal-toggle="modal-rbt-alert" data-i18n="[append]index.doRestartDevice">
                                <!-- <i class="ti ti-rotate-rectangle"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="icon w-5 h-5 mr-2" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path
                                        d="M10.09 4.01l.496 -.495a2 2 0 0 1 2.828 0l7.071 7.07a2 2 0 0 1 0 2.83l-7.07 7.07a2 2 0 0 1 -2.83 0l-7.07 -7.07a2 2 0 0 1 0 -2.83l3.535 -3.535h-3.988" />
                                    <path d="M7.05 11.038v-3.988" />
                                </svg>
                            </button>
                            <button class="peer" type="button" data-dropdown data-dropdown-placement="bottom"
                                data-dropdown-offset="0,10">
                                <!-- <i class="ti ti-chevrons-down"></i> -->
                                <svg xmlns="http://www.w3.org/2000/svg" class="icon w-5 h-5" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                    <path d="M7 7l5 5l5 -5" />
                                    <path d="M7 13l5 5l5 -5" />
                                </svg>
                            </button>
                            <ul class="dropdown-menu peer-[.show]:block servicemenu-container hidden">
                                <li class="cooler-switch-onoff group" data-i18n="[append]index.toggleCooling">
                                    <!-- <i class="ti ti-car-fan"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon dark:group-hover:stroke-white group-hover:stroke-violet-600"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path d="M12 12v-9l4.912 1.914a1.7 1.7 0 0 1 .428 2.925z" />
                                        <path d="M12 12h9l-1.914 4.912a1.7 1.7 0 0 1 -2.925 .428z" />
                                        <path d="M12 12h-9l1.914 -4.912a1.7 1.7 0 0 1 2.925 -.428z" />
                                        <path d="M12 12v9l-4.912 -1.914a1.7 1.7 0 0 1 -.428 -2.925z" />
                                    </svg>
                                </li>
                                <li data-modal-toggle="modal-rst-alert" class="group"
                                    data-i18n="[append]index.eraseConfig">
                                    <!-- <i class="ti ti-database-x"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon dark:group-hover:stroke-white group-hover:stroke-violet-600"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path
                                            d="M4 6c0 1.657 3.582 3 8 3s8 -1.343 8 -3s-3.582 -3 -8 -3s-8 1.343 -8 3" />
                                        <path d="M4 6v6c0 1.657 3.582 3 8 3c.537 0 1.062 -.02 1.57 -.058" />
                                        <path d="M20 13.5v-7.5" />
                                        <path d="M4 12v6c0 1.657 3.582 3 8 3c.384 0 .762 -.01 1.132 -.03" />
                                        <path d="M22 22l-5 -5" />
                                        <path d="M17 22l5 -5" />
                                    </svg>
                                </li>
                            </ul>
                        </div>
                    </div>
                    <!-- SERVICE MENU END -->
                </div>
                <div class="card col-span-full">
                    <div class="body w-full">
                        <div id="smthch" class="px-4 smdn:px-1 py-4">
                            <div class="grid w-full mdup:grid-cols-2 gap-4 smdn:grid-rows-2">
                                <div class="relative">
                                    <div id="op-chart-tmp"></div>
                                </div>
                                <div class="relative">
                                    <div id="op-chart-ram"></div>
                                </div>
                            </div>
                        </div>
                        <div id="pwmx" class="px-4 smdn:px-1 mb-4 hidden">
                            <div class="inline-flex justify-between pb-2 w-full m-0 pt-2">
                                <div class="py-1 pl-1" data-i18n="index.powerStateHistory"></div>
                                <div class="pl-2">
                                    <button type="button" class="btn-card-hdr" id="pwst-chart-reload"
                                        data-tooltip="index.reloadChartTooltip" data-tooltip-placement="left">
                                        <!-- <i class="ti ti-refresh"></i> -->
                                        <svg xmlns="http://www.w3.org/2000/svg" class="icon w-4 h-4" viewBox="0 0 24 24"
                                            fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                            stroke-linejoin="round"
                                            class="icon icon-tabler icons-tabler-outline icon-tabler-refresh">
                                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                            <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
                                            <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
                                        </svg>
                                    </button>
                                </div>
                            </div>
                            <div class="relative">
                                <div id="pwr-chart"></div>
                            </div>
                        </div>
                        <div id="dtch" class="px-4 smdn:px-1 mb-4 hidden">
                            <div class="inline-flex justify-between pb-2 w-full m-0 pt-2">
                                <div class="py-1 pl-1" data-i18n="index.temperatureRecords"></div>
                                <div class="pl-2 inline-flex">
                                    <div class="pr-2">
                                        <button type="button" class="btn-card-hdr" id="trecs-chart-reload"
                                            data-tooltip="index.reloadChartTooltip" data-tooltip-placement="left">
                                            <!-- <i class="ti ti-refresh"></i> -->
                                            <svg xmlns="http://www.w3.org/2000/svg" class="icon w-4 h-4"
                                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                                stroke-linecap="round" stroke-linejoin="round">
                                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                                <path d="M20 11a8.1 8.1 0 0 0 -15.5 -2m-.5 -4v4h4" />
                                                <path d="M4 13a8.1 8.1 0 0 0 15.5 2m.5 4v-4h-4" />
                                            </svg>
                                        </button>
                                    </div>
                                    <select id="dc-period">
                                        <option value="0" data-i18n="today"></option>
                                        <option value="1" data-i18n="yesterday"></option>
                                        <option value="2" data-i18n="lastXdays" data-i18n-options='{"d":7}'></option>
                                        <option value="3" data-i18n="lastMonth"></option>
                                        <option value="4" data-i18n="allTime"></option>
                                    </select>
                                </div>
                            </div>
                            <div class="relative">
                                <div id="trecs-chart"></div>
                            </div>
                        </div>
                        <div class="flatnav">
                            <div class="nav">
                                <a href="#smthch" class="group active">
                                    <!-- <i class="ti ti-clock-2"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon w-5 h-5 dark:group-hover:stroke-white group-hover:stroke-gray-800 dark:group-[.active]:stroke-white group-[.active]:stroke-violet-800"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path
                                            d="M4 4m0 1a1 1 0 0 1 1 -1h14a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-14a1 1 0 0 1 -1 -1z" />
                                        <path d="M12 7v5l3 3" />
                                        <path d="M4 12h1" />
                                        <path d="M19 12h1" />
                                        <path d="M12 19v1" />
                                    </svg>
                                    <span data-i18n="index.realTimeTab"></span>
                                </a>
                            </div>
                            <div class="nav">
                                <a href="#pwmx" class="group">
                                    <!-- <i class="ti ti-bolt"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon w-5 h-5 dark:group-hover:stroke-white group-hover:stroke-gray-800 dark:group-[.active]:stroke-white group-[.active]:stroke-violet-800"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11" />
                                    </svg>
                                    <span data-i18n="index.powerStatusTab"></span>
                                </a>
                            </div>
                            <div class="nav">
                                <a href="#dtch" class="group">
                                    <!-- <i class="ti ti-temperature"></i> -->
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        class="icon w-5 h-5 dark:group-hover:stroke-white group-hover:stroke-gray-800 dark:group-[.active]:stroke-white group-[.active]:stroke-violet-800"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                        stroke-linecap="round" stroke-linejoin="round">
                                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                        <path d="M10 13.5a4 4 0 1 0 4 0v-8.5a2 2 0 0 0 -4 0v8.5" />
                                        <path d="M10 9l4 0" />
                                    </svg>
                                    <span data-i18n="index.tempChartTab"></span>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card col-span-full">
                    <div class="title">
                        <div data-i18n="[append]index.titleLogs">
                            <svg xmlns="http://www.w3.org/2000/svg" class="inline icon w-5 h-5 mr-2" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round"
                                class="icon icon-tabler icons-tabler-outline icon-tabler-report">
                                <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                                <path d="M8 5h-2a2 2 0 0 0 -2 2v12a2 2 0 0 0 2 2h5.697" />
                                <path d="M18 14v4h4" />
