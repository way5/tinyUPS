<!DOCTYPE html>
<html lang="en-US" class="dark">

<head>
    <meta http-equiv="content-type" content="text/html; charset=utf-8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="referrer" content="origin" />
    <meta name="viewport" content="user-scalable=no, width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title data-i18n="error.pageTitle"></title>
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>

<body>
    <section class="error-wrapper">
        <div class="px-8 w-full mx-auto xs:p-0 max-w-md">
            <div class="items-center justify-center text-center w-full">
                <h1 class="error-code">404</h1>
                <p class="my-6 leading-relaxed" data-i18n="error.noPageMsg"></p>
                <div class="flex justify-center">
                    <a href="/"
                        class="group mt-3 text-violet-500 dark:hover:text-violet-300 hover:text-violet-400 inline-flex items-center transition-colors duration-500 ease-in-out"
                        data-i18n="[append]error.buttonBack">
                        <!-- <i class="ti ti-arrow-left-dashed mr-2 text-lg"></i> -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 mr-2 stroke-violet-500 dark:group-hover:stroke-violet-300 group-hover:stroke-violet-400" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                            <path d="M5 12h6m3 0h1.5m3 0h.5" />
                            <path d="M5 12l6 6" />
                            <path d="M5 12l6 -6" />
                        </svg>
                    </a>
                </div>
            </div>
        </div>
    </section>
</body>

</html>
